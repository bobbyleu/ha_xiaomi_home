name: Auto Release

# 每次推送到默认分支后，按 manifest.json 中的版本号自动创建 tag 并发布 Release，
# 附带 custom_components/xiaomi_home 的 ZIP 包供 HACS / 手动安装下载。
# 版本号未变（tag 已存在）时跳过，避免重复发布；也支持手动推送 v* tag 或手动触发。
on:
  push:
    branches:
      - main
      - master
      - test
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read integration version
        id: version
        shell: bash
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('custom_components/xiaomi_home/manifest.json', encoding='utf-8'))['version'])")
          # 去掉开头可能存在的 v，统一拼出 v<version> 作为 tag
          VERSION_NO_V=${VERSION#v}
          # 只有 -alpha/-beta/-rc/-dev/-preview 才算预发布；-bobbyleu.N 是分叉修订号，属于正式版
          if [[ "$VERSION_NO_V" =~ -(alpha|beta|rc|dev|preview) ]]; then
            IS_PRERELEASE=true
          else
            IS_PRERELEASE=false
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_no_v=$VERSION_NO_V" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Integration version: $VERSION -> tag v$VERSION_NO_V (prerelease=$IS_PRERELEASE)"

      - name: Check whether tag already exists
        id: check
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual dispatch: refresh existing release in place."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "Tag push event: publish release directly."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version_no_v }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.version.outputs.version_no_v }} already exists; skip duplicate release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: ZIP component dir
        if: steps.check.outputs.skip != 'true'
        shell: bash
        run: |
          COMPONENT_DIR="${{ github.workspace }}/custom_components/xiaomi_home"
          # HA 2026.11 内置 Marketplace 会从 release ZIP 的顶层读取 hacs.json，
          # 缺失会导致 "missing the hacs.json file required for installation"。
          # 打包时临时把仓库根目录的 hacs.json 放进组件目录，使其位于 ZIP 顶层。
          cp "${{ github.workspace }}/hacs.json" "$COMPONENT_DIR/hacs.json"
          trap 'rm -f "$COMPONENT_DIR/hacs.json"' EXIT
          cd "$COMPONENT_DIR"
          zip -r "${{ github.workspace }}/xiaomi_home.zip" ./

      - name: Publish release
        if: steps.check.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version_no_v }}
          name: v${{ steps.version.outputs.version_no_v }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.version.outputs.is_prerelease == 'true' }}
          files: ${{ github.workspace }}/xiaomi_home.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
